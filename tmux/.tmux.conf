# https://tmuxcheatsheet.com/
set-option -sa terminal-overrides ",xterm*:Tc"

# C-b ... really?
unbind-key C-b
set -g prefix C-s
bind C-s send-prefix

# Reload
unbind r 
bind r source-file ~/.tmux.conf

# Shell
set -g default-shell $SHELL

set-option -g status-position top

# C-s C-s for last active window
bind-key C-s last-window

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 0 is too far from C-s ;)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Simpler split mappings
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim mode :)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Auto-install TPM on first tmux startup.
# If ~/.tmux is a broken symlink, fallback to ~/.config/tmux/plugins/tpm.
run-shell '
TPM_DIR="$HOME/.tmux/plugins/tpm"
if [ -L "$HOME/.tmux" ] && [ ! -e "$HOME/.tmux" ]; then
  TPM_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm"
fi

# Keep TPM plugin path aligned with where TPM is installed.
tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$(dirname "$TPM_DIR")/"

if [ ! -d "$TPM_DIR" ]; then
  mkdir -p "$(dirname "$TPM_DIR")" &&
  git clone https://github.com/tmux-plugins/tpm "$TPM_DIR" >/dev/null 2>&1 ||
  { tmux display-message "TPM install failed (git/rede/permissao)"; exit 0; }
fi

if [ -x "$TPM_DIR/tpm" ]; then
  "$TPM_DIR/tpm"
else
  tmux display-message "TPM not available; plugin manager skipped"
fi

# First run bootstrap: if only TPM exists, install declared plugins automatically.
PLUGIN_DIR="$(dirname "$TPM_DIR")"
if [ -d "$PLUGIN_DIR/tpm" ]; then
  plugin_dir_count="$(find "$PLUGIN_DIR" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d " ")"
  if [ "${plugin_dir_count:-0}" -le 1 ]; then
    "$TPM_DIR/bin/install_plugins" >/dev/null 2>&1 &&
    tmux display-message "TPM plugins installed; reload tmux (prefix+r)" ||
    tmux display-message "TPM plugins install failed; use prefix+I"
  fi
fi
'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "#{thm_black}"

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory user host"
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

