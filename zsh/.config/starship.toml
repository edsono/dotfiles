add_newline = true
command_timeout = 500
format = "[$hostname$directory$git_branch$git_status$cmd_duration]($style)$character"

[aws]
disabled = true

[package]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[nodejs]
disabled = true

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"

[hostname]
ssh_only = true
format = "[󰌘 $hostname ]($style)"
style = "bold #00D7FF"

[directory]
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[cmd_duration]
min_time = 1000
format = '[$duration](bold yellow) '

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "italic cyan"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = "+ "
renamed    = "» "
deleted    = "✘ "
